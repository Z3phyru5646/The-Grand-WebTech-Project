<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Wellness Overview - FitTrack Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white font-sans">

    <nav class="bg-white/10 backdrop-blur-md fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <span class="text-2xl font-bold text-cyan-400">FitTrack Pro</span>
                <div class="hidden md:flex space-x-4">
                    <a href="index.html" class="nav-link active">Overview</a>
                    <a href="activity.html" class="nav-link">Activity Log</a>
                    <a href="meals.html" class="nav-link">Meal Planner</a>
                    <a href="summary.html" class="nav-link">Summary</a>
                </div>
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-white/20">☀️</button>
            </div>
        </div>
    </nav>

    <main class="pt-24 max-w-7xl mx-auto px-4">
        <div id="dashboard-header" class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold">Daily Wellness Overview</h1>
            <div id="clock" class="text-2xl font-mono glass-card px-4 py-2"></div>
        </div>
        <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Stat cards will be dynamically inserted here -->
        </div>
    </main>

    <!-- Goal Setting Modal -->
    <div id="goal-modal" class="modal-overlay">
        <div class="modal-content glass-card p-8 text-center">
            <h2 class="text-2xl font-bold mb-4">Set Daily Goals</h2>
            <form id="goal-form" class="space-y-4">
                <div>
                    <label for="steps-goal" class="block text-left mb-1">Steps</label>
                    <input type="number" id="steps-goal" class="w-full bg-white/5 p-3 rounded-md border border-white/20">
                </div>
                <div>
                    <label for="calories-goal" class="block text-left mb-1">Calories (kcal)</label>
                    <input type="number" id="calories-goal" class="w-full bg-white/5 p-3 rounded-md border border-white/20">
                </div>
                <div>
                    <label for="water-goal" class="block text-left mb-1">Water (liters)</label>
                    <input type="number" id="water-goal" step="0.1" class="w-full bg-white/5 p-3 rounded-md border border-white/20">
                </div>
                <div class="flex space-x-4 mt-6">
                    <button type="submit" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-md">Save Goals</button>
                    <button type="button" id="close-goal-modal" class="w-full bg-white/10 text-white font-bold py-3 rounded-md">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
