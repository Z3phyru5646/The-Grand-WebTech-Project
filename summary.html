<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insights & Summary - FitTrack Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white font-sans">

    <nav class="bg-white/10 backdrop-blur-md fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <span class="text-2xl font-bold text-green-400">FitTrack Pro</span>
                <div class="hidden md:flex items-center space-x-4">
                    <a href="index.html" class="nav-link">Overview</a>
                    <a href="activity.html" class="nav-link">Activity Log</a>
                    <a href="meals.html" class="nav-link">Meal Planner</a>
                    <a href="summary.html" class="nav-link active">Summary</a>
                    <button id="theme-toggle" class="text-2xl">☀️</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-24 max-w-7xl mx-auto px-4">
        <h1 class="text-3xl font-bold mb-8">Insights & Summary</h1>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass-card p-6">
                <h2 class="text-2xl font-bold mb-4">Weekly Activity (minutes)</h2>
                <div id="activity-chart" class="chart-container"></div>
            </div>
            <div class="glass-card p-6">
                <h2 class="text-2xl font-bold mb-4">Weekly Calorie Burn</h2>
                <div id="calorie-chart" class="chart-container"></div>
            </div>
        </div>
        <div class="mt-8 flex space-x-4">
            <button id="download-summary" class="bg-green-500 text-black font-bold py-3 px-6 rounded-md">Download Summary</button>
            <button id="reset-dashboard" class="bg-red-500 text-white font-bold py-3 px-6 rounded-md">Reset Dashboard</button>
        </div>
    </main>

    <div id="download-modal" class="modal-overlay">
        <div class="modal-content glass-card p-8 text-center">
            <h2 class="text-2xl font-bold mb-4">Download Started</h2>
            <p>Your summary is being prepared (Simulated).</p>
            <button id="close-download-modal" class="mt-6 bg-green-500 text-black py-2 px-6 rounded-md">Close</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/summary.js"></script>
</body>
</html>
